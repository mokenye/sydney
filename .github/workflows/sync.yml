name: 6-Hour YouTube Sync

on:
  schedule:
    # Runs every 6 hours starting at Midnight PST (08:00 UTC)
    # 08:09 (12:09 AM PST), 14:09 (6:09 AM PST), 20:09 (12:09 PM PST), 02:09 (6:09 PM PST)
    - cron: '9 2,8,14,20 * * *' 
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  sync_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        # Tells GitHub to look for requirements.txt in the worker subfolder
        working-directory: ./worker
        run: pip install google-api-python-client supabase isodate

      - name: Run Sync Script
        env:
          # These must match the Secret names in your GitHub Repo Settings
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        # Tells GitHub to execute the script inside the worker subfolder
        working-directory: ./worker
        run: python worker.py